pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		mavenCentral()
		gradlePluginPortal()
	}

	resolutionStrategy {
		eachPlugin {
			if (requested.id.id in ['net.fabricmc.fabric-loom', 'fabric-loom']) {
				useModule("net.fabricmc:fabric-loom:${requested.version}")
			}
		}
	}
}

// Should match your modid
rootProject.name = 'lifepath'

// M13-3: multi-loader layout — common holds loader-agnostic code (zero
// net.fabric* imports, enforced by verifyNoFabricImports); fabric hosts the
// Fabric adapter + entrypoints; M13-4 adds the neoforge module.
include 'common', 'fabric', 'neoforge'

lifepath.species.amphibian.description: "Children of the shallows. Underwater they breathe, see, and swim like natives; they can knit wounds with river-magic. In arid lands their skin dries to a crawling weakness."
lifepath.species.amphibian.name: "Amphibian"
lifepath.species.amphibian.strength.0: "Breathe, see and swim freely underwater"
lifepath.species.amphibian.strength.1: "Knit wounds with river-magic"
lifepath.species.amphibian.weakness.0: "Dry land cracks your skin to a crawling weakness"
lifepath.species.anima.description: "Beasts know them as their own. Animals never hunt them, their presence steadies the heart and quickens the feet, and a touch mends the pack; but their hollow bones crack on falls, and flesh is no food to them."
lifepath.species.anima.name: "Anima"
lifepath.species.anima.strength.0: "Animals never hunt you"
lifepath.species.anima.strength.1: "Your touch mends the pack"
lifepath.species.anima.weakness.0: "Hollow bones make falls hurt more"
lifepath.species.anima.weakness.1: "Herbivore diet: meat does not feed you"
lifepath.species.automaton.description: "Life inside a nonliving frame. They do not drown and their hull turns blows aside; but water gums their joints, and they can overclock their frame for short bursts."
lifepath.species.automaton.name: "Automaton"
lifepath.species.automaton.strength.0: "Cannot drown"
lifepath.species.automaton.strength.1: "Iron hull turns blows aside"
lifepath.species.automaton.strength.2: "Overclock for short bursts"
lifepath.species.automaton.strength.3: "Iron feeds your chassis — ingots and nuggets are your meals"
lifepath.species.automaton.weakness.0: "Water gums your joints with rust"
lifepath.species.automaton.weakness.1: "Only iron nourishes you"
lifepath.species.celestial.description: "Beings with divine affinity. Sunlight restores them, falls mean nothing, and they can smite the undead - but the Nether is an exile far from the heavens."
lifepath.species.celestial.name: "Celestial"
lifepath.species.celestial.strength.0: "Sunlight restores you"
lifepath.species.celestial.strength.1: "Falls mean nothing"
lifepath.species.celestial.strength.2: "Can smite the undead"
lifepath.species.celestial.weakness.0: "The Nether is an exile far from the heavens"
lifepath.species.dragonborn.description: "Fire runs in their blood. Flames cannot hurt them and only feed the molten core; but the deep cold bites twice as deep. Their breath is a furnace unleashed."
lifepath.species.dragonborn.name: "Dragonborn"
lifepath.species.dragonborn.strength.0: "Fire cannot hurt you and feeds your core"
lifepath.species.dragonborn.strength.1: "Unleash a furnace breath"
lifepath.species.dragonborn.weakness.0: "Deep cold bites twice as deep"
lifepath.species.dwarf.description: "Compact and subterranean. Mining aptitude can't fall below B. Cave-dark speeds their hands, blows land lighter on a miner's build, and stoneform can still a killing blow; but water drags at them like a millstone."
lifepath.species.dwarf.name: "Dwarf"
lifepath.species.dwarf.strength.0: "Mining aptitude never falls below B"
lifepath.species.dwarf.strength.1: "Cave-dark speeds hands; all damage lands lighter"
lifepath.species.dwarf.strength.2: "Stoneform can still a killing blow"
lifepath.species.dwarf.strength.3: "Carry 15% more"
lifepath.species.dwarf.weakness.0: "Water drags at you like a millstone"
lifepath.species.enderian.description: "Void-touched wanderers. Ender pearls barely sting them, the End itself sharpens them, and they can blink through space; but water burns like acid."
lifepath.species.enderian.name: "Enderian"
lifepath.species.enderian.strength.0: "Ender pearls barely sting"
lifepath.species.enderian.strength.1: "The deep void below the world sharpens you"
lifepath.species.enderian.strength.2: "Blink through space"
lifepath.species.enderian.weakness.0: "Water burns like acid — rain and snow too"
lifepath.species.goliath.description: "Large of body and stronger for it. Athletics aptitude can't fall below B. Their frame towers and hits harder, and a warcry rattles foes; but arrows find them easier and falls land harder."
lifepath.species.goliath.name: "Goliath"
lifepath.species.goliath.strength.0: "Athletics aptitude never falls below B"
lifepath.species.goliath.strength.1: "Towering frame hits harder"
lifepath.species.goliath.strength.2: "Warcry rattles foes"
lifepath.species.goliath.strength.3: "Carry 50% more"
lifepath.species.goliath.weakness.0: "Arrows find you easier"
lifepath.species.goliath.weakness.1: "Falls land harder"
lifepath.species.hellborn.description: "Infernal blood, nether-born. Piglins treat them as kin, fire barely singes them, and the Nether itself lends them strength; but standing water quenches their flame. They can ignite foes around them."
lifepath.species.hellborn.name: "Hellborn"
lifepath.species.hellborn.strength.0: "Piglins treat you as kin"
lifepath.species.hellborn.strength.1: "Fire barely singes you"
lifepath.species.hellborn.strength.2: "Flame and burning land lend you strength"
lifepath.species.hellborn.strength.3: "Ignite foes around you"
lifepath.species.hellborn.weakness.0: "Rain, snow and cold sap your flame"
lifepath.species.human.description: "No innate gifts, no hidden burdens. Humans are the baseline. What they become is earned entirely through skill and specialization."
lifepath.species.human.name: "Human"
lifepath.species.human.strength.0: "No innate drawbacks; what you become is earned"
lifepath.species.iceborn.description: "Children of the cold. Iceborn carry a temperature meter: frost and ice keep them sharp and quick to mend, while heat, fire, and lava drag them toward sluggish weakness and burning."
lifepath.species.iceborn.name: "Iceborn"
lifepath.species.iceborn.strength.0: "Frost and ice keep you sharp and quick to mend"
lifepath.species.iceborn.strength.1: "Your strikes freeze and slow enemies"
lifepath.species.iceborn.weakness.0: "Heat, fire and lava drag you toward sluggish weakness"
lifepath.species.phantom.description: "Void-affiliated beings who alternate between material and immaterial states. While phased, arrows pass through them and they drift - but sunlight destabilizes the veil."
lifepath.species.phantom.name: "Phantom"
lifepath.species.phantom.strength.0: "Phase out: arrows pass through you"
lifepath.species.phantom.strength.1: "Drift while immaterial"
lifepath.species.phantom.weakness.0: "Sunlight destabilizes your veil"
lifepath.species.phoenix.description: "Descendants of the first Phoenix - fire does not touch them, flame itself mends them, and they can immolate and rise again. Water quenches the inner fire."
lifepath.species.phoenix.name: "Phoenix"
lifepath.species.phoenix.strength.0: "Fire does not touch you and flame mends you"
lifepath.species.phoenix.strength.1: "Your wings carry you — flight burns your inner flame"
lifepath.species.phoenix.strength.2: "Death is a molt — you return frail, then blaze back"
lifepath.species.phoenix.weakness.0: "Water quenches your inner fire"
lifepath.species.phoenix.weakness.1: "The rebirth molt leaves you small, slow, and earthbound"
lifepath.species.sylvian.description: "Nature-aligned. Forests make them quicker and hardier, vegetation carries their stride, flowers cleanse them; but arid lands weaken them and the undead cut deeper."
lifepath.species.sylvian.name: "Sylvian"
lifepath.species.sylvian.strength.0: "Forests make you quicker and hardier"
lifepath.species.sylvian.strength.1: "Vegetation carries your stride"
lifepath.species.sylvian.strength.2: "Flowers cleanse you"
lifepath.species.sylvian.weakness.0: "Arid lands weaken you"
lifepath.species.sylvian.weakness.1: "The undead cut deeper"
lifepath.species.undead.description: "The grave holds no power over them. Undead draw sustenance only from necrotic flesh, walk unbothered among their kin, and at night can see the living outlined through the dark."
lifepath.species.undead.name: "Undead"
lifepath.species.undead.strength.0: "Walk unbothered among the undead"
lifepath.species.undead.strength.1: "See the living outlined at night"
lifepath.species.undead.weakness.0: "Only necrotic flesh feeds you"
lifepath.species.undead.weakness.1: "Daylight under open sky sets you alight"

lifepath.species.celestial.strength.2: "Poți lovi nemorții"
lifepath.species.celestial.weakness.0: "Netherul e un exil departe de ceruri"
lifepath.species.dragonborn.description: "Focul le curge prin vene. Flăcările nu-i pot răni și doar hrănesc miezul topit; dar frigul adânc îi mușcă de două ori mai tare. Suflarea lor e un furnal dezlănțuit."
lifepath.species.dragonborn.name: "Dragonborn"
lifepath.species.dragonborn.strength.0: "Focul nu te poate răni și îți hrănește miezul"
lifepath.species.dragonborn.strength.1: "Dezlănțuie o suflare de furnal"
lifepath.species.dragonborn.weakness.0: "Frigul adânc mușcă de două ori mai tare"
lifepath.species.dwarf.description: "Compact și subteran. Aptitudinea de minerit nu poate scădea sub B. Bezna peșterilor le iutește mâinile, loviturile cad mai ușor pe constituția de miner, iar forma de piatră poate opri o lovitură mortală; dar apa îi trage ca o piatră de moară."
lifepath.species.dwarf.name: "Pitic"
lifepath.species.dwarf.strength.0: "Aptitudinea de minerit nu scade niciodată sub B"
lifepath.species.dwarf.strength.1: "Bezna peșterilor îți iutește mâinile; orice lovitură cade mai ușor"
lifepath.species.dwarf.strength.2: "Forma de piatră poate opri o lovitură mortală"
lifepath.species.dwarf.strength.3: "Poți căra cu 15% mai mult"
lifepath.species.dwarf.weakness.0: "Apa te trage ca o piatră de moară"
lifepath.species.enderian.description: "Rătăcitori atinși de Gol. Perlele de Ender abia îi înțeapă, Endul însuși îi ascute, și pot păși prin spațiu; dar apa îi arde ca acidul."
lifepath.species.enderian.name: "Enderian"
lifepath.species.enderian.strength.0: "Perlele de Ender abia te înțeapă"
lifepath.species.enderian.strength.1: "Golul adânc de sub lume te ascute"
lifepath.species.enderian.strength.2: "Pășește prin spațiu"
lifepath.species.enderian.weakness.0: "Apa arde ca acidul — și ploaia și zăpada"
lifepath.species.goliath.description: "Mari de statură și mai puternici pentru asta. Aptitudinea de atletism nu poate scădea sub B. Cadrul lor înalt lovește mai tare, iar un strigăt de război zdruncină dușmanii; dar săgețile îi găsesc mai ușor, iar căderile cad mai greu."
lifepath.species.goliath.name: "Goliath"
lifepath.species.goliath.strength.0: "Aptitudinea de atletism nu scade niciodată sub B"
lifepath.species.goliath.strength.1: "Statura înaltă lovește mai tare"
lifepath.species.goliath.strength.2: "Strigătul de război zdruncină dușmanii"
lifepath.species.goliath.strength.3: "Poți căra cu 50% mai mult"
lifepath.species.goliath.weakness.0: "Săgețile te găsesc mai ușor"
lifepath.species.goliath.weakness.1: "Căderile cad mai greu"
lifepath.species.hellborn.description: "Sânge infernal, născuți în Nether. Piglinii îi tratează ca pe ai lor, focul abia îi pârlește, iar Netherul însuși le dăruiește putere; dar apa stătătoare le stinge flacăra. Pot aprinde dușmanii din jur."
lifepath.species.hellborn.name: "Hellborn"
lifepath.species.hellborn.strength.0: "Piglinii te tratează ca pe unul de-al lor"
lifepath.species.hellborn.strength.1: "Focul abia te pârlește"
lifepath.species.hellborn.strength.2: "Flacăra și pământul arzând îți dăruiesc putere"
lifepath.species.hellborn.strength.3: "Aprinde dușmanii din jurul tău"
lifepath.species.hellborn.weakness.0: "Ploaia, zăpada și frigul îți sting flacăra"
lifepath.species.human.description: "Nici daruri innăscute, nici povări ascunse. Oamenii sunt linia de bază. Ce devin se câștigă întru totul prin pricepere și specializare."
lifepath.species.human.name: "Uman"
lifepath.species.human.strength.0: "Niciun dezavantaj innăscut; ce devii e câștigat"
lifepath.species.human.strength.1: "Norocul pur și simplu te găsește"
lifepath.species.human.strength.2: "La ușa morții țâșnești în loc să te prăbușești"
lifepath.species.iceborn.description: "Copii ai frigului. Iceborn poartă un contor de temperatură: gerul și gheața îi țin ascuțiți și grabnici la vindecare, în timp ce căldura, focul și lava îi târăsc spre slăbiciune moale și arsură."
lifepath.species.iceborn.name: "Iceborn"
lifepath.species.iceborn.strength.0: "Gerul și gheața te țin ascuțit și grabnic la vindecare"
lifepath.species.iceborn.strength.1: "Loviturile tale îngheață și încetinesc dușmanii"
lifepath.species.iceborn.strength.2: "Îngheți o mulțime la un singur gest"
lifepath.species.iceborn.weakness.0: "Căldura, focul și lava te târăsc spre slăbiciune"
lifepath.species.phantom.description: "Ființe afiliate Golului, care alternează între stări materiale și imateriale. Fazați, săgețile le trec prin corp și plutesc; dar lumina soarelui le destabilizează vălul."
lifepath.species.phantom.name: "Fantomă"
lifepath.species.phantom.strength.0: "Fazează: săgețile trec prin tine"
lifepath.species.phantom.strength.1: "Plutești cât ești imaterial"
lifepath.species.phantom.weakness.0: "Lumina soarelui îți destabilizează vălul"
lifepath.species.phoenix.description: "Urmașii primei Phoenix: focul nu-i atinge, flacăra însăși îi vindeacă, și se pot imola și renăște. Apa le stinge focul interior."
lifepath.species.phoenix.name: "Phoenix"
lifepath.species.phoenix.strength.0: "Focul nu te atinge și flacăra te vindeacă"
lifepath.species.phoenix.strength.1: "Aripile te poartă — zborul îți arde flacăra interioară"
lifepath.species.phoenix.strength.2: "Moartea e o napârlire — revii fragil, apoi aprinzi din nou"
lifepath.species.phoenix.weakness.0: "Apa îți stinge focul interior"
lifepath.species.phoenix.weakness.1: "Napârlirea te lasă mic, încet și lipit de pământ"
lifepath.species.sylvian.description: "Aliniați naturii. Pădurile îi fac mai iuți și mai rezistenți, vegetația le poartă pasul, florile îi curăță; dar pământurile aride îi slăbesc, iar nemorții taie mai adânc."
lifepath.species.sylvian.name: "Sylvian"
lifepath.species.sylvian.strength.0: "Pădurile te fac mai iute și mai rezistent"
lifepath.species.sylvian.strength.1: "Vegetația îți poartă pasul"
lifepath.species.sylvian.strength.2: "Florile te curăță"
lifepath.species.sylvian.weakness.0: "Pământurile aride te slăbesc"
lifepath.species.sylvian.weakness.1: "Nemorții taie mai adânc"
lifepath.species.undead.description: "Mormântul nu are putere asupra lor. Nemorții se hrănesc doar din carne necrotică, merg nestingheriți printre ai lor, și noaptea pot vedea vii conturați prin întuneric."
lifepath.species.undead.name: "Nemort"
lifepath.species.undead.strength.0: "Mergi nestingherit printre nemorți"
lifepath.species.undead.strength.1: "Vezi vii conturați noaptea"
lifepath.species.undead.strength.2: "Noaptea îți hrănește loviturile"
lifepath.species.undead.strength.3: "Atingerea ta putrezește"
lifepath.species.undead.weakness.0: "Doar carnea necrotică te hrănește"
lifepath.species.undead.weakness.1: "Lumina zilei sub cerul liber te aprinde"

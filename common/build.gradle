plugins {
	id 'fabric-loom' version "${loom_version}"
}

// M13-3: common compiles against Minecraft (Mojmap) only — no loader deps.
// It is not a mod itself (no fabric.mod.json, no mods block); loaders embed
// it. splitEnvironmentSourceSets keeps client code client-only.
loom {
	splitEnvironmentSourceSets()
}

repositories {
	// mixin annotation compile-only deps (loaders bundle the runtime)
	maven { url = 'https://maven.llamalad7.net/' }
	maven { url = 'https://maven.fabricmc.net/' }
	mavenCentral()
}

sourceSets {
	test {
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()

	// Mixin annotations for common's mixin classes — loaders bundle the
	// runtime (fabric-loader ships sponge-mixin + MixinExtras).
	compileOnly "net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7"
	compileOnly "io.github.llamalad7:mixinextras-common:0.4.1"
	compileOnly "org.jetbrains:annotations:24.1.0"

	// TOML config parsing — loaders bundle these into their own jars.
	implementation "com.electronwill.night-config:toml:3.8.4"
	implementation "com.electronwill.night-config:core:3.8.4"

	testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.jar {
	// LGPL-3.0 §4(b): the nested jar ships inside the loader jar; carry the
	// licenses so the bundle is self-describing at every level.
	from rootProject.files("LICENSE", "LICENSE.GPL", "NOTICE")
}

// i18n pipeline: src/main/lang/<locale>.yaml files are the editable source of
// truth — translators never touch Java or JSON. Minecraft's localization
// system consumes assets/<mod>/lang/<locale>.json, so this task generates
// them. en_us is the base locale every other file is validated against.
def langSource = layout.projectDirectory.dir('src/main/lang')
def langOut = layout.buildDirectory.dir('generated/lang')

def escapeJson = { String s ->
	def out = new StringBuilder()
	for (char c : s.toCharArray()) {
		if (c == '"' as char) out.append('\\"')
		else if (c == '\\' as char) out.append('\\\\')
		else if (c < ' ') out.append('\\u%04x'.formatted((int) c))
		else out.append(c)
	}
	return out.toString()
}

def generateLangJson = tasks.register('generateLangJson') {
	inputs.dir(langSource)
	outputs.dir(langOut)
	doLast {
		def loaderOpts = new org.yaml.snakeyaml.LoaderOptions()
		loaderOpts.setAllowDuplicateKeys(false)
		def yaml = new org.yaml.snakeyaml.Yaml(loaderOpts)
		File[] files = langSource.asFile.listFiles(
				{ d, n -> n ==~ /[a-z]{2}_[a-z]{2}\.yaml/ } as FilenameFilter)
		if (files == null || files.length == 0) {
			throw new GradleException('src/main/lang has no <locale>.yaml files')
		}
		Map<String, String> baseKeys = null
		// en_us first — other locales are checked against its key set.
		files.sort { it.name }.sort { it.name == 'en_us.yaml' ? 0 : 1 }.each { f ->
			Map data
			try {
				f.withInputStream { data = yaml.load(it) }
			} catch (Exception e) {
				throw new GradleException("Malformed YAML in ${f.name}: ${e.message}", e)
			}
			if (!(data instanceof Map)) {
				throw new GradleException("${f.name}: expected a flat key: \"value\" map")
			}
			def entries = new LinkedHashMap<String, String>()
			data.each { k, v ->
				String key = String.valueOf(k)
				if (!(key ==~ /^[a-z0-9_.]+$/)) {
					throw new GradleException("${f.name}: bad key '${key}' "
							+ '(allowed: a-z 0-9 _ .)')
				}
				if (!(v instanceof CharSequence || v instanceof Number || v instanceof Boolean)) {
					throw new GradleException("${f.name}: '${key}' needs a plain string value")
				}
				entries.put(key, String.valueOf(v))
			}
			if (baseKeys == null) {
				baseKeys = entries
			} else {
				def extra = entries.keySet() - baseKeys.keySet()
				if (!extra.isEmpty()) {
					throw new GradleException("${f.name} has keys missing from en_us.yaml: ${extra}")
				}
				def missing = baseKeys.keySet() - entries.keySet()
				if (!missing.isEmpty()) {
					println("warn: ${f.name} misses ${missing.size()} keys"
							+ " (en_us fallback covers them): ${missing}")
				}
				entries.each { key, val ->
					def want = (baseKeys[key] =~ /%(\d+\$)?[a-z]/).collect { it[0] }
					def got = (val =~ /%(\d+\$)?[a-z]/).collect { it[0] }
					if (want != got) {
						throw new GradleException("${f.name}: '${key}' placeholders ${got} "
								+ "!= en_us ${want}")
					}
				}
			}
			def json = new StringBuilder('{\n')
			entries.eachWithIndex { k, v, i ->
				json << '\t"' << escapeJson(k) << '": "' << escapeJson(v) << '"'
				if (i < entries.size() - 1) json << ','
				json << '\n'
			}
			json << '}'
			def outFile = new File(langOut.get().asFile,
					f.name - '.yaml' + '.json')
			outFile.getParentFile().mkdirs()
			outFile.setText(json.toString(), 'UTF-8')
		}
	}
}

processResources {
	dependsOn generateLangJson
	from(langOut) { into 'assets/lifepath/lang' }
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

base {
	archivesName = 'lifepath-common'
}

// M13-3 acceptance gate: common must never import a loader API — Fabric or
// NeoForge (M13-4 extended the scan). Runs under check (and therefore build
// and CI); keep it cheap — a line scan, not a compile-time processor.
def verifyNoFabricImports = tasks.register('verifyNoFabricImports') {
	doLast {
		def offenders = []
		fileTree(dir: 'src', includes: ['**/*.java']).each { f ->
			f.eachLine { line ->
				if (line.contains('net.fabric') || line.contains('net.neoforged')) {
					offenders << "${f.path}: ${line.trim()}"
				}
			}
		}
		if (!offenders.isEmpty()) {
			throw new GradleException(
					'common/ must not reference loader APIs (net.fabric*, net.neoforged*):\n'
					+ offenders.join('\n'))
		}
	}
}
check.dependsOn verifyNoFabricImports

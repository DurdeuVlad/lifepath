name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant wrapper
        run: chmod +x gradlew

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag 'v$tag' does not match gradle.properties version '$version'"
            exit 1
          fi

      - name: Build
        run: ./gradlew clean build --console=plain

      # M13-5: expanded mod metadata must agree with the released version —
      # guards the placeholder substitution on both loaders.
      - name: Verify loader metadata version parity
        run: |
          ver=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          fab=$(grep -oE '"version": *"[^"]+"' fabric/build/resources/main/fabric.mod.json | cut -d'"' -f4)
          nf=$(grep -oE '^[[:space:]]*version="[^"]+"' neoforge/build/resources/main/META-INF/neoforge.mods.toml | head -1 | grep -oE '"[^"]+"' | tr -d '"')
          echo "gradle.properties=$ver fabric.mod.json=$fab neoforge.mods.toml=$nf"
          if [ "$fab" != "$ver" ] || [ "$nf" != "$ver" ]; then
            echo "::error::version skew between mod metadata files"
            exit 1
          fi
          for f in \
            "fabric/build/libs/lifepath-$ver-fabric.jar" \
            "fabric/build/libs/lifepath-$ver-fabric-sources.jar" \
            "neoforge/build/libs/lifepath-$ver-neoforge.jar" \
            "neoforge/build/libs/lifepath-$ver-neoforge-sources.jar"; do
            if [ ! -f "$f" ]; then
              echo "::error::missing expected artifact $f"
              exit 1
            fi
          done

      - name: Checksum
        run: |
          sha256sum fabric/build/libs/lifepath-*-fabric*.jar \
                    neoforge/build/libs/lifepath-*-neoforge*.jar > checksums.txt
          cat checksums.txt

      # CurseForge file naming: beta/alpha/release derived from the version
      # string so `v1.0.0` ships "release" while `v1.0.0-beta.2` ships "beta".
      - name: Resolve publish metadata
        id: meta
        run: |
          v="$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          case "$v" in
            *alpha*) t=alpha ;;
            *beta*)  t=beta ;;
            *)       t=release ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "releasetype=$t" >> "$GITHUB_OUTPUT"
          echo "resolved: version=$v releasetype=$t"

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **Lifepath ${{ github.ref_name }}** — multi-loader release. **NeoForge 1.21.1 is the primary loader**; Fabric 1.21.1 ships as secondary support.

            | Loader | File | Requires |
            |---|---|---|
            | NeoForge 21.1+ (MC 1.21.1) | `lifepath-*-neoforge.jar` | NeoForge only |
            | Fabric 0.16.10+ (MC 1.21.1) | `lifepath-*-fabric.jar` | Fabric API 0.116.0+ |

            `checksums.txt` covers every jar.
          files: |
            neoforge/build/libs/lifepath-*-neoforge.jar
            neoforge/build/libs/lifepath-*-neoforge-sources.jar
            fabric/build/libs/lifepath-*-fabric.jar
            fabric/build/libs/lifepath-*-fabric-sources.jar
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # CurseForge uploads run only when the project exists and its id is
      # configured — without `vars.CURSEFORGE_PROJECT_ID` these steps skip and
      # the GitHub release flow is unaffected. See docs/RELEASE_ENGINEERING.md.
      - name: Publish NeoForge jar to CurseForge
        if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          files: neoforge/build/libs/lifepath-*-neoforge.jar
          name: Lifepath ${{ steps.meta.outputs.version }} for NeoForge (MC 1.21.1)
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.releasetype }}
          changelog-file: CHANGELOG.md
          loaders: neoforge
          game-versions: |
            1.21.1
            Java 21

      - name: Publish Fabric jar to CurseForge
        if: ${{ vars.CURSEFORGE_PROJECT_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          files: fabric/build/libs/lifepath-*-fabric.jar
          name: Lifepath ${{ steps.meta.outputs.version }} for Fabric (MC 1.21.1)
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.releasetype }}
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: |
            1.21.1
            Java 21
          dependencies: |
            fabric-api(required)

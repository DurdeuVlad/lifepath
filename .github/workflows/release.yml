name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant wrapper
        run: chmod +x gradlew

      - name: Verify tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag 'v$tag' does not match gradle.properties version '$version'"
            exit 1
          fi

      - name: Build
        run: ./gradlew clean build --console=plain

      - name: Checksum
        run: cd build/libs && sha256sum lifepath-*.jar > ../checksums.txt && cat ../checksums.txt

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/libs/lifepath-*.jar
            build/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

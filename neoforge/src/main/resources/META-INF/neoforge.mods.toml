modLoader="javafml"
loaderVersion="[4,)"
license="LGPL-3.0-only"
issueTrackerURL="https://github.com/DurdeuVlad/lifepath/issues"

[[mods]]
	modId="lifepath"
	version="${version}"
	displayName="Lifepath"
	authors="DurdeuVlad"
	description='''Independent character progression framework: species, specializations, skills, aptitudes, decay, abilities.'''
	logoFile="assets/lifepath/icon.png"

# Mixin configs live in this module (loader wiring); the mixin classes live
# in common/.
[[mixins]]
	config="lifepath.mixins.json"
[[mixins]]
	config="lifepath.client.mixins.json"
# Optional-mod compat: only applied when the foreign mod is present
[[mixins]]
	config="lifepath.compat.overgeared.mixins.json"
	requiredMods=["overgeared"]
[[mixins]]
	config="lifepath.compat.farmersdelight.mixins.json"
	requiredMods=["farmersdelight"]
[[mixins]]
	config="lifepath.compat.kaleidoscope.mixins.json"
	requiredMods=["kaleidoscope_cookery"]
[[mixins]]
	config="lifepath.compat.kaleidoscopetavern.mixins.json"
	requiredMods=["kaleidoscope_tavern"]
[[mixins]]

plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

loom {
	splitEnvironmentSourceSets()

	runs {
		// Client gets its own game dir — the default fabric/run is shared
		// with runServer, and a running server holds locks on
		// logs/latest.log and .fabric/processedMods that make a parallel
		// client launch fail during mod remapping.
		client {
			runDir "run-client"
			// Same dev-UX default as neoforge's runClient: auto-join the
			// local dev server instead of landing on the title screen.
			programArgs '--quickPlayMultiplayer', 'localhost:25565'
		}
	}

	mods {
		"lifepath" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			sourceSet project(":common").sourceSets.main
			sourceSet project(":common").sourceSets.client
		}
	}
}

sourceSets {
	// The loom `mods` block groups entries for the loader, but the JVM
	// classpath comes from the sourceSet runtime classpaths — common's
	// named output dirs must be present there for dev class loading.
	main {
		runtimeClasspath += project(':common').sourceSets.main.output
		runtimeClasspath += project(':common').sourceSets.client.output
	}
	client {
		compileClasspath += project(':common').sourceSets.client.output
		runtimeClasspath += project(':common').sourceSets.main.output
		runtimeClasspath += project(':common').sourceSets.client.output
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Compile against common; dev runtime picks up its classes via the
	// sourceSet runtimeClasspath wiring above (named output dirs). A plain
	// `implementation` dep would put the remapped (intermediary) jar on the
	// dev classpath and break class loading.
	compileOnly project(':common')
	// Bundle common inside the fabric jar (jar-in-jar) for production.
	include project(':common')

	// TOML config parsing (bundled into the mod jar; include is non-transitive,
	// so core must be bundled explicitly alongside toml).
	implementation "com.electronwill.night-config:toml:3.8.4"
	implementation "com.electronwill.night-config:core:3.8.4"
	include "com.electronwill.night-config:toml:3.8.4"
	include "com.electronwill.night-config:core:3.8.4"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.jar {
	// LGPL-3.0 §4(b): object code must ship with copies of both the LGPL
	// and the GPL it extends; NOTICE carries the copyright statement.
	from rootProject.files("LICENSE", "LICENSE.GPL", "NOTICE")
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

base {
	archivesName = archives_base_name
}

// M13-5 dual-loader artifacts: lifepath-<ver>-fabric.jar alongside the
// neoforge module's lifepath-<ver>-neoforge.jar. The sources jar carries
// common's sources too — that's the bulk of what ships.
tasks.named('remapJar') {
	// Loom names the remapped output eagerly at configuration time — the
	// classifier alone doesn't reach it, so set the final file name.
	archiveFileName = "${archives_base_name}-${project.version}-fabric.jar"
}
tasks.named('remapSourcesJar') {
	archiveFileName = "${archives_base_name}-${project.version}-fabric-sources.jar"
}
tasks.named('sourcesJar') {
	archiveClassifier = 'fabric-sources'
	from(project(':common').sourceSets.main.allJava,
			project(':common').sourceSets.client.allJava)
}

// The publication exists so `publishToMavenLocal` gives API consumers a
// resolvable dev artifact. Remote distribution is jar-based via CurseForge
// (mc-publish in CI) — consumers pull it through the CurseForge maven, so no
// repositories{} block belongs here.
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
}
